[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mt5-copier"
version = "0.45.6"
description = "Base portavel para copiador Telegram -> MetaTrader 5."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Telethon>=1.36,<2.0",
    "python-telegram-bot>=21.0,<22.0",
    "pytest>=8.0,<9.0",
    "cryptography>=42.0,<45.0",
    "tzdata>=2025.2",
    "asyncpg>=0.29,<0.32",
    "httpx>=0.27,<0.29",
]

[project.scripts]
telegram-mt5-copier = "telegram_mt5_copier.__main__:main"
telegram-copier = "telegram_mt5_copier.app:main"
telegram-login = "telegram_mt5_copier.telegram_login:main"
telegram-management-bot = "telegram_mt5_copier.bot:main"
telegram-mt5-onboarding = "telegram_mt5_copier.web_server:main"
telegram-mt5-worker = "telegram_mt5_copier.mt5_worker:main"
telegram-mt5-worker-pool = "telegram_mt5_copier.mt5_worker_pool:main"
telegram-mt5-supervisor = "telegram_mt5_copier.supervisor:main"
telegram-mt5-health-monitor = "telegram_mt5_copier.operational_health:main"
telegram-market-news = "telegram_mt5_copier.market_news_monitor:main"
telegram-mt5-backup = "telegram_mt5_copier.backup:main"
telegram-mt5-execution-agent = "telegram_mt5_copier.execution_agent:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["telegram_mt5_copier*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
